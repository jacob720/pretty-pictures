[project]
name = "create-images"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pillow",
    "numpy",
    "imageio[ffmpeg]"
]

dynamic = ["version"]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "mypy",
    "pyright",
    "ruff",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
lint.select = [
    "B",      # flake8-bugbear - https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "C4",     # flake8-comprehensions - https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "E",      # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",      # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "W",      # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",      # isort - https://docs.astral.sh/ruff/rules/#isort-i
    "UP",     # pyupgrade - https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "SLF",    # self - https://docs.astral.sh/ruff/settings/#lintflake8-self
    "PT012",  # flake8-pytest-style rules - https://docs.astral.sh/ruff/rules/pytest-raises-with-multiple-statements/#pytest-raises-with-multiple-statements-pt012
    "RUF018", # walrus operators in asserts - https://docs.astral.sh/ruff/rules/assignment-in-assert/
]

[tool.ruff.format]
quote-style = "double"      # "single" or "double"
indent-style = "space"      # "tab" or "space"
skip-magic-trailing-comma = false


